# --- CLUSTER AGNOSTIC ---
# Precipitation patches
PRECIP_VAR_NAME: "TOT_PREC"
DRIZZLE_THRESHOLD: 0.1
PATCH_SIZE: 128
DOWNSCALING_FACTOR: 6
PIXEL_SIZE_KM: 2.0
PERSISTENCE_THRESHOLD: 1.0

ANALYSIS_DATA_PERCENTAGE: 100

# Ratios
SPLIT_RATIOS:
  train: 0.8
  validation: 0.1
  test: 0.1

# DataLoaders
NUM_WORKERS: 24
BATCH_SIZE: 128
SAMPLE_WEIGHTS:
  "dry": 1.0
  "normal": 1.0
  "extreme": 1.0

EXPERIMENT_NAME: "GammaEmulatorv3"

# Gamma emulator settings
ARCHITECTURE: "Attention" 
Q_EMBEDDING_DIM: 32
CONSTRAINT_MODE: "hard"
CONSTRAINT_WARMUP_EPOCHS: 10
LOSS_LAMBDA: 0.25 

# Weights loss
WEIGHT_A: 1.0
WEIGHT_P: 1.0
WEIGHT_CC: 0.5

LAMBDA_MONOTONICITY: 0.1
LAMBDA_PLAUSIBILITY: 0.1
LAMBDA_BOUND: 0.1

SUBSAMPLE_FRACTION: 1
device: "cuda"
NUM_EPOCHS: 100
PATIENCE: 10
EARLY_STOPPING: true
EARLY_STOPPING_PATIENCE: 15
EARLY_STOPPING_DELTA: 0.001

LEARNING_RATE: 0.00005
WEIGHT_DECAY: 0.00001

QUANTILE_LEVELS: [0.01, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.99]

# Evaluation emulator (Using the best Hard+Attention model)
EMULATOR_CHECKPOINT_PATH: "experiment_runs/GammaEmulatorv2_B_2025-11-27_06-48-27/best_model_checkpoint.pth" #"experiment_runs/GammaEmulatorv2_2025-11-21_04-39-13/best_model_checkpoint.pth"

# Training super resolution
METRIC_LOSS_MODE: 'train'
METRIC_LOSS_TYPE: 'geometric'
METRIC_WARMUP_EPOCHS: 10
METRIC_RAMP_EPOCHS: 10
METRIC_LOSS_WEIGHT: 0.1
S_ESTIMATION_SAMPLES: 10000

# Evaluation
EVAL_MODE: 'none'
TRUST_TAU: 0.045